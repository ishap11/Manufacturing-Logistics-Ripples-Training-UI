<header class="header-container">
  <!-- ── LEFT: Logo ── -->
  <div class="header-left">
    <button type="button" class="mobile-menu-btn" (click)="toggleMobileSidebar()">
      <i class="fas fa-bars"></i>
    </button>
    <a routerLink="/" class="logo-area">
      <div class="logo-icon">
        <i class="fas fa-cubes-stacked"></i>
      </div>
      <div class="logo-text-group">
        <span class="logo-title">DC IMS</span>
        <span class="logo-subtitle">Supply Chain OS</span>
      </div>
    </a>
  </div>

  <!-- ── CENTER: Global Search ── -->
  <div class="header-center">
    <div class="global-search">
      <i class="fas fa-search search-icon"></i>
      <input
        type="text"
        class="search-input"
        placeholder="Search POs, Items, Shipments..."
        [(ngModel)]="searchQuery"
        (keyup.enter)="triggerGlobalSearch()"
      />
    </div>
  </div>

  <!-- ── RIGHT: Actions ── -->
  <div class="header-right">

    <!-- Role Selector -->
    <div class="role-chip">
      <i class="fas fa-id-badge role-chip-icon"></i>
      <select class="role-select" [(ngModel)]="currentRole" title="Switch Role">
        <option value="Admin">Admin</option>
        <option value="Operator">Operator</option>
        <option value="Manager">Manager</option>
      </select>
      <i class="fas fa-chevron-down role-chip-arrow"></i>
    </div>

    <div class="header-divider"></div>

    <!-- Notification Bell -->
    <button type="button" class="action-btn" aria-label="Notifications" title="Notifications">
      <i class="fas fa-bell"></i>
      <span class="notif-badge">3</span>
    </button>

    <!-- Settings -->
    <button type="button" class="action-btn" aria-label="Settings" title="Settings" routerLink="/administration">
      <i class="fas fa-gear"></i>
    </button>

    <div class="header-divider"></div>

    <!-- User Profile Dropdown -->
    <div class="user-menu">
      <button type="button" class="user-trigger" (click)="toggleProfileDropdown()" aria-label="User Menu">
        <div class="user-avatar-circle">
          <i class="fas fa-user"></i>
        </div>
        <div class="user-meta">
          <span class="user-name">{{ currentUser }}</span>
          <span class="user-role">{{ currentRole }}</span>
        </div>
        <i class="fas fa-chevron-down chevron-icon" [class.rotated]="isProfileDropdownOpen"></i>
      </button>

      @if (isProfileDropdownOpen) {
        <div class="profile-dropdown">
          <div class="dropdown-header">
            <div class="dropdown-avatar">
              <i class="fas fa-user"></i>
            </div>
            <div class="dropdown-user-info">
              <span class="dropdown-name">{{ currentUser }}</span>
              <span class="dropdown-role">{{ currentRole }}</span>
            </div>
          </div>

          <div class="dropdown-body">
            <a class="dropdown-item" routerLink="/administration" (click)="isProfileDropdownOpen = false">
              <i class="fas fa-user-circle"></i>
              <span>My Profile</span>
            </a>
            <a class="dropdown-item" routerLink="/administration" (click)="isProfileDropdownOpen = false">
              <i class="fas fa-shield-halved"></i>
              <span>Security</span>
            </a>
            <a class="dropdown-item" routerLink="/administration" (click)="isProfileDropdownOpen = false">
              <i class="fas fa-gear"></i>
              <span>Preferences</span>
            </a>
          </div>

          <div class="dropdown-footer">
            <button class="dropdown-logout" (click)="performLogout()">
              <i class="fas fa-right-from-bracket"></i>
              <span>Sign Out</span>
            </button>
          </div>
        </div>
      }
    </div>

  </div>
</header>
