<div class="table-card">

    <h3>Dispatch Records</h3>

    <table>

        <thead>

            <tr>

                <th>Dispatch ID</th>
                <th>DC ID</th>
                <th>Store ID</th>
                <th>Dispatch Date</th>
                <th>Status ID</th>

            </tr>

        </thead>

        <tbody>

            @for(dispatch of dispatches; track dispatch.dispatchId){

                <tr>

                    <td>{{dispatch.dispatchId}}</td>

                    <td>{{dispatch.dcId}}</td>

                    <td>{{dispatch.storeId}}</td>

                    <td>{{dispatch.dispatchDate}}</td>

                    <td>{{dispatch.statusId}}</td>

                </tr>

            }

        </tbody>

    </table>

</div>
