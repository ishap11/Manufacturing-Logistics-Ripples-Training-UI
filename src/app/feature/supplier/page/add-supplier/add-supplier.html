<section class="supplier-page">
  <div class="page-heading"><h1>Add Supplier</h1><p>Supplier details are saved directly to the Supplier API.</p></div>
  <form class="supplier-form" #supplierForm="ngForm" (ngSubmit)="addSupplier(supplierForm)" novalidate>
    <label [class.invalid-field]="fieldMessage(companyName, 'companyName')">Company Name<input #companyName="ngModel" name="companyName" [(ngModel)]="supplier.companyName" (ngModelChange)="clearFieldError('companyName')" minlength="3" required /> @if (fieldMessage(companyName, 'companyName')) { <small>{{ fieldMessage(companyName, 'companyName') }}</small> }</label>
    <label [class.invalid-field]="fieldMessage(contactPerson, 'contactPerson')">Contact Person<input #contactPerson="ngModel" name="contactPerson" [(ngModel)]="supplier.contactPerson" (ngModelChange)="clearFieldError('contactPerson')" minlength="3" pattern="^[a-zA-Z\s]+$" required /> @if (fieldMessage(contactPerson, 'contactPerson')) { <small>{{ fieldMessage(contactPerson, 'contactPerson') }}</small> }</label>
    <label [class.invalid-field]="fieldMessage(age, 'age')">Age<input #age="ngModel" type="number" name="age" [(ngModel)]="supplier.age" (ngModelChange)="clearFieldError('age')" min="18" max="70" required /> @if (fieldMessage(age, 'age')) { <small>{{ fieldMessage(age, 'age') }}</small> }</label>
    <label [class.invalid-field]="fieldMessage(phone, 'phone')">Phone<input #phone="ngModel" type="tel" name="phone" [(ngModel)]="supplier.phone" (ngModelChange)="clearFieldError('phone')" pattern="[0-9]{10}" required /> @if (fieldMessage(phone, 'phone')) { <small>{{ fieldMessage(phone, 'phone') }}</small> }</label>
    <label [class.invalid-field]="fieldMessage(email, 'email')">Email<input #email="ngModel" type="email" name="email" [(ngModel)]="supplier.email" (ngModelChange)="clearFieldError('email')" email required /> @if (fieldMessage(email, 'email')) { <small>{{ fieldMessage(email, 'email') }}</small> }</label>
    <label [class.invalid-field]="fieldMessage(supplierType, 'supplierType')">Supplier Type<input #supplierType="ngModel" name="supplierType" [(ngModel)]="supplier.supplierType" (ngModelChange)="clearFieldError('supplierType')" required /> @if (fieldMessage(supplierType, 'supplierType')) { <small>{{ fieldMessage(supplierType, 'supplierType') }}</small> }</label>
    <label [class.invalid-field]="fieldMessage(city, 'city')">City<input #city="ngModel" name="city" [(ngModel)]="supplier.city" (ngModelChange)="clearFieldError('city')" required /> @if (fieldMessage(city, 'city')) { <small>{{ fieldMessage(city, 'city') }}</small> }</label>
    <label [class.invalid-field]="fieldMessage(state, 'state')">State<input #state="ngModel" name="state" [(ngModel)]="supplier.state" (ngModelChange)="clearFieldError('state')" required /> @if (fieldMessage(state, 'state')) { <small>{{ fieldMessage(state, 'state') }}</small> }</label>
    <label [class.invalid-field]="fieldMessage(country, 'country')">Country<input #country="ngModel" name="country" [(ngModel)]="supplier.country" (ngModelChange)="clearFieldError('country')" required /> @if (fieldMessage(country, 'country')) { <small>{{ fieldMessage(country, 'country') }}</small> }</label>
    <label [class.invalid-field]="fieldMessage(pincode, 'pincode')">Pincode<input #pincode="ngModel" name="pincode" [(ngModel)]="supplier.pincode" (ngModelChange)="clearFieldError('pincode')" pattern="[0-9]{6}" required /> @if (fieldMessage(pincode, 'pincode')) { <small>{{ fieldMessage(pincode, 'pincode') }}</small> }</label>
    <label class="full-width" [class.invalid-field]="fieldMessage(address, 'address')">Address<textarea #address="ngModel" name="address" rows="4" [(ngModel)]="supplier.address" (ngModelChange)="clearFieldError('address')" required></textarea> @if (fieldMessage(address, 'address')) { <small>{{ fieldMessage(address, 'address') }}</small> }</label>
    <button type="submit" [disabled]="isLoading">{{ isLoading ? 'Saving...' : 'Add Supplier' }}</button>
  </form>
  @if (message) { <p class="message">{{ message }}</p> }
  @if (errorMessage) { <p class="message error-message">{{ errorMessage }}</p> }
</section>
