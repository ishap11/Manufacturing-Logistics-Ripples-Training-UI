<div class="store-page-container">
  <app-page-header
    title="Filter Stores"
    description="Filter store profiles by operational status and region."
  ></app-page-header>

  <div class="card p-3 mb-4">
    <div class="filter-row">
      <label>
        <span>Status</span>
        <select [(ngModel)]="statusFilter" (change)="applyFilters()">
          <option value="">All Statuses</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
          <option value="Pending">Pending</option>
        </select>
      </label>

      <label>
        <span>Region</span>
        <select [(ngModel)]="regionFilter" (change)="applyFilters()">
          <option value="">All Regions</option>
          <option value="South">South</option>
          <option value="Midwest">Midwest</option>
          <option value="West">West</option>
        </select>
      </label>
    </div>
  </div>

  @if (loading) {
    <app-loader text="Filtering stores..."></app-loader>
  }

  @if (!loading) {
    <div class="card">
      @if (stores.length > 0) {
        <div class="table-responsive" style="border: none; margin: 0;">
          <table class="table table-striped">
            <thead>
              <tr>
                <th>Store Code</th>
                <th>Store Name</th>
                <th>City</th>
                <th>Region</th>
                <th class="text-center">Status</th>
              </tr>
            </thead>
            <tbody>
              @for (store of stores; track store.Store_Id_PK) {
                <tr>
                  <td class="text-bold text-muted">{{ store.Store_Code }}</td>
                  <td class="text-bold text-primary">{{ store.Store_Name }}</td>
                  <td>{{ store.city }}</td>
                  <td>{{ store.region }}</td>
                  <td class="text-center">
                    <app-status-badge [status]="store.status"></app-status-badge>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      } @else {
        <app-empty-state
          icon="fa-filter"
          title="No Stores Matched"
          description="No store profiles match the selected filter criteria."
        ></app-empty-state>
      }
    </div>
  }
</div>
