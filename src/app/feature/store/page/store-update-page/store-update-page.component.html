<div class="store-page-container">
  <app-page-header
    title="Update Store Profile"
    description="Find a store and update manager, address, region and operational status details."
  ></app-page-header>

  <div class="card p-3 mb-4">
    <app-search-box
      placeholder="Find store by id, code or name before updating..."
      (search)="findStore($event)"
    ></app-search-box>
  </div>

  @if (loading) {
    <app-loader text="Loading store profile..."></app-loader>
  }

  @if (!loading && selectedStore) {
    <div class="card p-3">
      <div class="selected-store">
        <div>
          <div class="text-bold text-primary">{{ selectedStore.Store_Code }}</div>
          <div class="text-muted">Store Id {{ selectedStore.Store_Id_PK }}</div>
        </div>
        <app-status-badge [status]="selectedStore.status"></app-status-badge>
      </div>

      <form [formGroup]="updateForm" (ngSubmit)="updateStore()" class="store-form">
        <div class="form-grid">
          <label class="form-field">
            <span>Store Name</span>
            <input type="text" formControlName="Store_Name" />
          </label>

          <label class="form-field">
            <span>Manager Id</span>
            <input type="number" formControlName="Store_Manager_Id_Fk" />
          </label>

          <label class="form-field">
            <span>Manager Name</span>
            <input type="text" formControlName="managerName" />
          </label>

          <label class="form-field">
            <span>Address Id</span>
            <input type="number" formControlName="Address_Id_FK" />
          </label>

          <label class="form-field">
            <span>Status Id</span>
            <input type="number" formControlName="Store_Status_Id_FK" />
          </label>

          <label class="form-field">
            <span>City</span>
            <input type="text" formControlName="city" />
          </label>

          <label class="form-field">
            <span>Region</span>
            <input type="text" formControlName="region" />
          </label>

          <label class="form-field">
            <span>Status</span>
            <select formControlName="status">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
              <option value="Pending">Pending</option>
            </select>
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" [disabled]="saving">
            <i class="fas fa-save mr-1"></i> {{ saving ? 'Updating...' : 'Update Profile' }}
          </button>
        </div>
      </form>
    </div>
  }

  @if (!loading && searched && !selectedStore) {
    <app-empty-state
      icon="fa-store-slash"
      title="Store Not Found"
      description="Search with another store id, store code or store name."
    ></app-empty-state>
  }

  @if (updatedStore) {
    <div class="card p-3 mt-3">
      <span class="text-bold text-success">{{ updatedStore.Store_Name }}</span>
      <span class="text-muted"> updated at {{ updatedStore.Updated_DateTime }}</span>
    </div>
  }
</div>
