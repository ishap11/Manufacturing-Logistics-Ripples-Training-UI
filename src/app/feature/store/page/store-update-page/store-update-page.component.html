<div class="store-page-container">
  <app-page-header
    title="Update Store Profile"
    description="Find a store by ID and update its details."
  ></app-page-header>

  <div class="card p-3 mb-4">
    <app-search-box
      placeholder="Enter Store ID to find before updating..."
      (search)="findStore($event)"
    ></app-search-box>
  </div>

  @if (loading) {
    <app-loader text="Loading store profile..."></app-loader>
  }

  @if (!loading && selectedStore) {
    <div class="card p-3">
      <div class="selected-store">
        <div>
          <div class="text-bold text-primary">{{ selectedStore.storeCode }}</div>
          <div class="text-muted">Store Id {{ selectedStore.storeIdPk }}</div>
        </div>
      </div>

      <form [formGroup]="updateForm" (ngSubmit)="updateStore()" class="store-form">
        <div class="form-grid">
          <label class="form-field">
            <span>Store Name</span>
            <input type="text" formControlName="StoreName" />
          </label>

          <label class="form-field">
            <span>Manager Id</span>
            <input type="number" formControlName="ManagersIdFk" />
          </label>

          <label class="form-field">
            <span>Status Id</span>
            <input type="number" formControlName="StoreStatusIdFk" />
          </label>

          <label class="form-field">
            <span>Updated By User Id</span>
            <input type="number" formControlName="UpdatedByUserIdFk" />
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" [disabled]="saving">
            <i class="fas fa-save mr-1"></i> {{ saving ? 'Updating...' : 'Update Profile' }}
          </button>
        </div>
      </form>
    </div>
  }

  @if (!loading && searched && !selectedStore) {
    <app-empty-state
      icon="fa-store-slash"
      title="Store Not Found"
      description="Search with another Store ID."
    ></app-empty-state>
  }

  @if (successMessage) {
    <div class="card p-3 mt-3">
      <div class="text-bold text-success">{{ successMessage }}</div>
    </div>
  }

  @if (errorMessage) {
    <div class="card p-3 mt-3">
      <div class="text-bold text-danger">{{ errorMessage }}</div>
    </div>
  }
</div>
