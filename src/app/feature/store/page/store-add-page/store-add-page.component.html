<div class="store-page-container">
  <app-page-header
    title="Add New Store"
    description="Create a new store profile with manager, address and status references."
  ></app-page-header>

  <div class="card p-3">
    <form [formGroup]="storeForm" (ngSubmit)="addStore()" class="store-form">
      <div class="form-grid">
        <label class="form-field">
          <span>Store Name</span>
          <input type="text" formControlName="StoreName" maxlength="100" placeholder="Central Plaza Store" />
        </label>

        <label class="form-field">
          <span>Manager</span>
          <select formControlName="ManagersIdFk">
            <option [ngValue]="null" disabled>
              {{ loadingManagers ? 'Loading managers...' : 'Select a manager' }}
            </option>
            @for (manager of managers; track manager.id) {
              <option [ngValue]="manager.id">{{ manager.name }}</option>
            }
          </select>
        </label>

        <label class="form-field">
          <span>Address</span>
          <select formControlName="AddressIdFk">
            <option [ngValue]="null" disabled>
              {{ loadingAddresses ? 'Loading addresses...' : 'Select an address' }}
            </option>
            @for (address of addresses; track address.id) {
              <option [ngValue]="address.id">{{ address.label }}</option>
            }
          </select>
        </label>

        <label class="form-field">
          <span>Status Id</span>
          <input type="number" formControlName="StoreStatusIdFk" placeholder="1" />
        </label>

        <label class="form-field">
          <span>Created By</span>
          <select formControlName="CreatedByUserIdFk">
            <option [ngValue]="null" disabled>
              {{ loadingUsers ? 'Loading users...' : 'Select a user' }}
            </option>
            @for (user of users; track user.id) {
              <option [ngValue]="user.id">{{ user.name }}</option>
            }
          </select>
        </label>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="storeForm.reset()">
          Clear
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          <i class="fas fa-plus mr-1"></i> {{ saving ? 'Saving...' : 'Add Store' }}
        </button>
      </div>
    </form>
  </div>

  @if (successMessage) {
    <div class="card p-3 mt-3">
      <div class="text-bold text-success">{{ successMessage }}</div>
    </div>
  }

  @if (errorMessage) {
    <div class="card p-3 mt-3">
      <div class="text-bold text-danger">{{ errorMessage }}</div>
    </div>
  }
</div>
